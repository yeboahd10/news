<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>EchoNews - Latest Breaking News & Updates</title>
    <meta name="description" content="Stay updated with the latest news from around the world. EchoNews brings you breaking news, trending stories, and in-depth coverage across multiple categories." />
    <meta name="keywords" content="news, breaking news, latest news, trending, world news, technology, business, entertainment, sports" />
    <meta name="author" content="EchoNews" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph & Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EchoNews - Latest Breaking News & Updates" />
    <meta property="og:description" content="Stay updated with the latest news from around the world. EchoNews brings you breaking news, trending stories, and in-depth coverage." />
    <meta property="og:url" content="https://echonewsgh.site" />
    <meta property="og:image" content="https://echonewsgh.site/src/assets/logo.png" />
    <meta property="og:site_name" content="EchoNews" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EchoNews - Latest Breaking News & Updates" />
    <meta name="twitter:description" content="Stay updated with the latest news from around the world." />
    <meta name="twitter:image" content="https://echonewsgh.site/src/assets/logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://echonewsgh.site" />
    
    <!-- Sitemap & Feed -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    
    <!-- JSON-LD Structured Data for SEO & Category Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "EchoNews",
      "url": "https://echonewsgh.site",
      "logo": "https://echonewsgh.site/src/assets/logo.png",
      "description": "EchoNews brings you breaking news, trending stories, and in-depth coverage across multiple categories",
      "sameAs": [
        "https://facebook.com/echonewsgh",
        "https://twitter.com/echonewsgh",
        "https://instagram.com/echonewsgh"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Editorial",
        "url": "https://echonewsgh.site/contact"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EchoNews",
      "url": "https://echonewsgh.site",
      "searchAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://echonewsgh.site/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "hasPartOfCatalog": [
        {
          "@type": "CollectionPage",
          "name": "Home",
          "url": "https://echonewsgh.site/category/Home"
        },
        {
          "@type": "CollectionPage",
          "name": "Politics",
          "url": "https://echonewsgh.site/category/Politics"
        },
        {
          "@type": "CollectionPage",
          "name": "Entertainment",
          "url": "https://echonewsgh.site/category/Entertainment"
        },
        {
          "@type": "CollectionPage",
          "name": "Sports",
          "url": "https://echonewsgh.site/category/Sports"
        }
      ]
    }
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
